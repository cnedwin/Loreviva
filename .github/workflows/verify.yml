name: Verify
on: [push, pull_request]
# Read-only default token: no write scope, no deployment, no pull_request_target.
permissions:
  contents: read
jobs:
  # The durability and coordinator layer (internal/localstate) refuses to open on
  # non-Windows volumes by design: R0 support is the verified Windows local
  # fixed-volume path. Unit packages therefore run on the platform they support.
  contracts-and-unit:
    runs-on: windows-latest
    steps:
      # Immutable reviewed action pins, matching the byte-policy workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: false
      # The contract artefacts, types and validators are generated: a tree whose
      # generated files disagree with their source is not reviewable.
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec node scripts/check-generated.mjs
      - run: pnpm run test:contracts
      - run: pnpm test:studio-build
      - run: pnpm check:studio
      - run: go build ./...
      - run: go vet ./internal/...
      # Unit packages must not need a database; anything that does belongs in the
      # integration suite, which runs against a disposable MySQL outside CI.
      # Temp files must live on a path whose real and lexical forms agree: the
      # local-state guard rejects short (8.3) profile paths, which is what the
      # default temp directory looks like on a Windows runner.
      # Packages listed here run with no database and no local fixed volume they
      # cannot open. Everything else (content, store, delivery and the integration
      # suite) needs a disposable MySQL and stays in the local gate, which the
      # README documents as the full verification ladder.
      - run: >-
          go test -count=1
          ./internal/wepkg ./internal/app ./internal/wire ./internal/runtime
          ./internal/domain ./internal/auth ./internal/settings ./internal/localstate
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
  # Portability smoke on the platform not yet supported for local state: the tree
  # must still build there, so a Linux-only build break is caught early.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/build-studio.mjs --check
      - run: go build ./...
